<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Background Sun Rays Circle -->
  <defs>
    <radialGradient id="sunGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#198754"/>
      <stop offset="100%" stop-color="#0b5e34"/>
    </radialGradient>
  </defs>
  <!-- 12 Primary Rays -->
  <g fill="#0b5e34" transform="translate(250, 250)">
    <!-- 12 Rays -->
    <path d="M -16,-180 L 0,-240 L 16,-180 Z" />
    <path d="M -16,-180 L 0,-240 L 16,-180 Z" transform="rotate(30)" />
    <path d="M -16,-180 L 0,-240 L 16,-180 Z" transform="rotate(60)" />
    <path d="M -16,-180 L 0,-240 L 16,-180 Z" transform="rotate(90)" />
    <path d="M -16,-180 L 0,-240 L 16,-180 Z" transform="rotate(120)" />
    <path d="M -16,-180 L 0,-240 L 16,-180 Z" transform="rotate(150)" />
    <path d="M -16,-180 L 0,-240 L 16,-180 Z" transform="rotate(180)" />
    <path d="M -16,-180 L 0,-240 L 16,-180 Z" transform="rotate(210)" />
    <path d="M -16,-180 L 0,-240 L 16,-180 Z" transform="rotate(240)" />
    <path d="M -16,-180 L 0,-240 L 16,-180 Z" transform="rotate(270)" />
    <path d="M -16,-180 L 0,-240 L 16,-180 Z" transform="rotate(300)" />
    <path d="M -16,-180 L 0,-240 L 16,-180 Z" transform="rotate(330)" />
  </g>
  <!-- Outer Gold/Green Rings -->
  <circle cx="250" cy="250" r="185" fill="#0b5e34" stroke="#ffffff" stroke-width="4"/>
  <circle cx="250" cy="250" r="175" fill="#094a29" stroke="#ffffff" stroke-width="3"/>
  <circle cx="250" cy="250" r="125" fill="#0b5e34" stroke="#ffffff" stroke-width="4"/>
  
  <!-- Text Ring: Syahadatain -->
  <!-- Centered Arabic text / Emblems -->
  <text x="250" y="112" fill="#ffffff" font-family="'Traditional Arabic', 'Scheherazade', 'Amiri', serif" font-size="20" font-weight="bold" text-anchor="middle">أَشْهَدُ أَنْ لاَ إِلَهَ إِلاَّ اللَّهُ</text>
  <text x="250" y="405" fill="#ffffff" font-family="'Traditional Arabic', 'Scheherazade', 'Amiri', serif" font-size="20" font-weight="bold" text-anchor="middle">وَأَشْهَدُ أَنَّ مُحَمَّدًا رَسُولُ اللَّهِ</text>
  
  <!-- Center Calligraphy: Muhammadiyah -->
  <g fill="#ffffff" transform="translate(250, 260) scale(1.15)">
    <!-- Elegant stylized symbol / central emblem -->
    <circle cx="0" cy="-10" r="75" fill="#083d21" />
    <text x="0" y="2" fill="#ffffff" font-family="'Traditional Arabic', 'Amiri', 'Arial', serif" font-size="34" font-weight="bold" text-anchor="middle">مُحَمَّدِيَّة</text>
    <path d="M -45,18 Q 0,38 45,18 Q 0,26 -45,18 Z" fill="#ffffff" />
  </g>
</svg>
